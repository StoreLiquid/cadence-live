<!doctype html>
<html lang=de>
<head>
<meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>cadence live</title>
<meta name=description content="iPod-Updates aus der Ferne mitverfolgen">
<meta name=theme-color content="#16161b">
<meta name=apple-mobile-web-app-capable content=yes>
<meta name=apple-mobile-web-app-status-bar-style content=black-translucent>
<meta name=apple-mobile-web-app-title content="cadence live">
<link rel=icon href="logo-64.png">
<link rel=apple-touch-icon href="logo-180.png">
<link rel=manifest href="manifest.json">
<style>
/* cadence live: zeigt die Stand-Meldungen, die cadence beim iPod-Update an ntfy.sh schickt (fernmeldung.py).
   Der Kanal steht in der Adresse hinter dem # (nicht im Code dieser Seite). */
:root { --bg:#111115; --karte:#1d1d24; --rand:#2c2c36; --text:#f2f2f6; --sub:#9a9aaa; --v1:#ff4f8b; --v2:#9b5cff;
        --ok:#2fbf71; --warn:#ffb020; --err:#ff4f5e; --blau:#4696fa; }
:root[data-theme="light"] { --bg:#f4f4f7; --karte:#fff; --rand:#e3e3ea; --text:#17171c; --sub:#6b6b78; }
* { box-sizing:border-box; }
html, body { margin:0; background:var(--bg); color:var(--text);
  font:15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
body { padding:env(safe-area-inset-top) 16px calc(24px + env(safe-area-inset-bottom)); max-width:760px; margin:0 auto; }
header { display:flex; align-items:center; gap:12px; padding:18px 0 14px; }
header img { width:44px; height:44px; border-radius:11px; box-shadow:0 4px 14px rgba(155,92,255,.35); }
header h1 { margin:0; font-size:21px; font-weight:800; letter-spacing:-.01em; flex:1; }
header h1 span { background:linear-gradient(90deg,var(--v1),var(--v2)); -webkit-background-clip:text; background-clip:text; color:transparent; }
.verb { font-size:12px; color:var(--sub); display:flex; align-items:center; gap:6px; }
.verb i { width:8px; height:8px; border-radius:50%; background:var(--sub); }
.verb.an i { background:var(--ok); box-shadow:0 0 8px var(--ok); }
.chips { display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; margin-bottom:14px; scrollbar-width:none; }
.chip { flex:none; display:flex; align-items:center; gap:8px; padding:8px 12px; border-radius:12px; border:1px solid var(--rand);
        background:var(--karte); cursor:pointer; font-weight:600; font-size:14px; color:var(--text); }
.chip small { color:var(--sub); font-weight:400; }
.chip.an { border-color:var(--v2); background:linear-gradient(135deg,rgba(255,79,139,.16),rgba(155,92,255,.16)); }
.punkt { width:9px; height:9px; border-radius:50%; flex:none; }
.punkt.laeuft { background:var(--blau); animation:puls 1.4s infinite; }
.punkt.fertig { background:var(--ok); } .punkt.fehler { background:var(--err); } .punkt.still { background:var(--warn); }
@keyframes puls { 50% { opacity:.35; } }
.karte { background:var(--karte); border:1px solid var(--rand); border-radius:18px; padding:18px; margin-bottom:14px; }
.kopf { display:flex; align-items:flex-start; gap:12px; }
.kopf .wer { flex:1; min-width:0; }
.kopf .wer b { font-size:18px; display:block; }
.kopf .wer span { color:var(--sub); font-size:13px; }
.zahl { font-size:40px; font-weight:800; letter-spacing:-.03em; line-height:1; }
.zahl small { font-size:18px; color:var(--sub); font-weight:600; }
.balken { height:12px; border-radius:6px; background:rgba(127,127,140,.18); overflow:hidden; margin:16px 0 8px; }
.balken div { height:100%; border-radius:6px; background:linear-gradient(90deg,var(--v1),var(--v2)); transition:width .8s ease; }
.balken.fertig div { background:var(--ok); } .balken.fehler div { background:var(--err); }
.zeile { display:flex; justify-content:space-between; gap:12px; color:var(--sub); font-size:13px; flex-wrap:wrap; }
.detail { margin-top:10px; font-size:14px; color:var(--text); overflow-wrap:anywhere; }
.schritte { margin-top:6px; }
.schr { display:flex; align-items:center; gap:12px; padding:8px 0; border-bottom:1px solid var(--rand); }
.schr:last-child { border-bottom:0; }
.schr .p { width:22px; height:22px; border-radius:50%; flex:none; display:grid; place-items:center; font-size:12px; font-weight:800;
           border:2px solid var(--rand); color:transparent; }
.schr.f .p { background:var(--ok); border-color:var(--ok); color:#fff; }
.schr.l .p { border-color:var(--v2); border-top-color:transparent; animation:dreh 1s linear infinite; }
.schr.l.stop .p { animation:none; border-color:var(--err); }
.schr.o { color:var(--sub); }
.schr.l b { font-weight:700; }
@keyframes dreh { to { transform:rotate(360deg); } }
.fehlerbox { border:1px solid var(--err); background:rgba(255,79,94,.1); border-radius:14px; padding:14px; margin-top:14px; }
.fehlerbox b { color:var(--err); }
.ok { border:1px solid var(--ok); background:rgba(47,191,113,.1); border-radius:14px; padding:14px; margin-top:14px; }
details { margin-top:14px; }
summary { cursor:pointer; color:var(--sub); font-size:14px; }
pre { margin:8px 0 0; padding:12px; background:rgba(0,0,0,.25); border-radius:10px; font:12px/1.5 ui-monospace,Menlo,Consolas,monospace;
      white-space:pre-wrap; overflow-wrap:anywhere; color:var(--sub); max-height:320px; overflow:auto; }
.leer { text-align:center; color:var(--sub); padding:40px 10px; }
.leer img { width:72px; border-radius:18px; opacity:.85; margin-bottom:12px; }
.hinweis { font-size:13px; color:var(--sub); }
.hinweis code { background:rgba(127,127,140,.18); padding:2px 6px; border-radius:6px; color:var(--text); overflow-wrap:anywhere; }
button { font:inherit; font-weight:600; border:0; border-radius:10px; padding:8px 14px; cursor:pointer; color:#fff;
         background:linear-gradient(135deg,var(--v1),var(--v2)); }
input { font:inherit; width:100%; padding:10px 12px; border-radius:10px; border:1px solid var(--rand); background:var(--bg); color:var(--text); }
.anfrage { border-color:var(--v2); }
button.zweit { background:transparent; border:1px solid var(--rand); color:var(--text); }
#anleitung .karte { border-color:var(--v2); }
#anleitung ol { padding-left:22px; margin:10px 0; } #anleitung li { margin:8px 0; }
.teilsym { display:inline-block; width:18px; height:18px; vertical-align:-3px; }
</style>
</head>
<body>
<header><img src="logo-180.png" alt=""><h1><span>cadence</span> live</h1><div class=verb id=verb><i></i><span>verbinde …</span></div></header>
<div id=anleitung></div>
<div id=anfragen></div>
<div class=chips id=chips></div>
<main id=haupt><div class=leer><img src="logo-180.png" alt=""><div>Warte auf Meldungen …</div></div></main>
<div class="karte hinweis" id=hilfe></div>
<script>
const SERVER = 'https://ntfy.sh/';
// Kanal hinter dem #; gemerkt, falls die Home-Bildschirm-App ohne # startet
const KANAL = (() => { let k = decodeURIComponent(location.hash.slice(1)).trim();
  try { if (k) localStorage.setItem('kanal', k); else k = localStorage.getItem('kanal') || ''; } catch (e) {}
  return k; })();
// öffentlicher Schlüssel von cadence-push auf dem Raspberry Pi (Web-Push, iOS 16.4+ in der Home-Bildschirm-App)
const VAPID = 'BNod-CshBCOcjPhAc4QoVNRpn8w6KOOcOFUKGfqvtVpoG8dwJZE-XNYanwCq0yuJHm6geSb1GuKTcgNBMvBMM0k';
const GERAETE = {};          // id -> letzter Stand
const ANFRAGEN = {};         // Rechnername -> Anfrage „möchte cadence live“
const LINK = location.origin + location.pathname + '#' + KANAL;
function speicher(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) {} }
let WAHL = null, LETZTE = 0;
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
const vor = t => { const s = Math.max(0, Date.now() / 1000 - t);
  return s < 60 ? 'gerade eben' : s < 3600 ? `vor ${Math.round(s / 60)} min` : `vor ${Math.round(s / 3600)} h`; };
function zustand(g) {
  if (g.zustand == 'laeuft' && Date.now() / 1000 - g.t > 180) return 'still';
  return g.zustand;
}
function aufnehmen(text) {
  let g; try { g = JSON.parse(text); } catch (e) { return; }
  if (g && g.v == 1 && g.typ == 'anfrage') {      // „cadence live anfordern“ in cadence gedrückt
    if (Date.now() / 1000 - g.t < 12 * 3600 && (!ANFRAGEN[g.pc] || ANFRAGEN[g.pc].t < g.t)) ANFRAGEN[g.pc] = g;
    return;
  }
  if (!g || g.v != 1 || !g.id) return;
  const alt = GERAETE[g.id];
  if (alt && alt.t > g.t) return;
  GERAETE[g.id] = g;
  if (!WAHL || (g.zustand == 'laeuft' && GERAETE[WAHL]?.zustand != 'laeuft')) WAHL = g.id;
}
function anfragenZeichnen() {
  const a = Object.values(ANFRAGEN).filter(x => +(speicher('anfrage_weg_' + x.pc) || 0) < x.t);
  const el = document.getElementById('anfragen');
  el.innerHTML = a.map(x => `<div class="karte anfrage"><b>📲 ${esc(x.pc)} möchte cadence live</b>
    <div class=hinweis style="margin:4px 0 10px">Schick ihm den Link – dann sieht er seine iPod-Updates selbst.</div>
    <button data-teilen="${esc(x.pc)}">Link teilen</button> <button class=zweit data-weg="${esc(x.pc)}">Erledigt</button></div>`).join('');
  el.querySelectorAll('[data-teilen]').forEach(b => b.onclick = async () => {
    try {
      if (navigator.share) await navigator.share({title: 'cadence live', text: 'Hier siehst du deine iPod-Updates live:', url: LINK});
      else { await navigator.clipboard.writeText(LINK); b.textContent = 'Link kopiert ✓'; }
    } catch (e) {}
  });
  el.querySelectorAll('[data-weg]').forEach(b => b.onclick = () => {
    speicher('anfrage_weg_' + b.dataset.weg, ANFRAGEN[b.dataset.weg].t); anfragenZeichnen(); });
}
function zeichnen() {
  anfragenZeichnen();
  const ids = Object.keys(GERAETE).sort((a, b) => GERAETE[b].t - GERAETE[a].t);
  document.getElementById('chips').innerHTML = ids.map(id => { const g = GERAETE[id];
    return `<div class="chip ${id == WAHL ? 'an' : ''}" data-id="${esc(id)}"><span class="punkt ${zustand(g)}"></span>${esc(g.name)}<small>${esc(g.pc)}</small></div>`; }).join('');
  document.querySelectorAll('.chip').forEach(c => c.onclick = () => { WAHL = c.dataset.id; zeichnen(); });
  const g = GERAETE[WAHL];
  if (!g) return;
  const z = zustand(g), lauf = g.zustand == 'laeuft';
  const min = Math.round((g.t - g.start) / 60);
  const rest = lauf && g.gesamt >= 5 ? Math.max(1, Math.round((g.t - g.start) / 60 * (100 - g.gesamt) / g.gesamt)) : null;
  const titel = {laeuft: 'läuft', fertig: 'fertig', fehler: 'Fehler', still: 'kein Lebenszeichen'}[z];
  document.getElementById('haupt').innerHTML = `
  <div class=karte>
    <div class=kopf><div class=wer><b>${esc(g.name)} · ${esc(g.pc)}</b>
      <span>${esc(g.art)}${g.von || g.nach ? ` · ${esc(g.von || '?')} → ${esc(g.nach || '?')}` : ''} · ${titel}</span></div>
      <div class=zahl>${z == 'fertig' ? 100 : g.gesamt}<small> %</small></div></div>
    <div class="balken ${z == 'fertig' ? 'fertig' : z == 'fehler' ? 'fehler' : ''}"><div style="width:${z == 'fertig' ? 100 : g.gesamt}%"></div></div>
    <div class=zeile><span>${lauf ? `seit ${min} min` : `Dauer ${min} min`}${rest ? ` · noch ca. ${rest} min` : ''}</span>
      <span>Stand ${vor(g.t)}</span></div>
    ${lauf && g.detail ? `<div class=detail>${esc(g.detail)}</div>` : ''}
    ${z == 'still' ? `<div class=fehlerbox><b>Seit ${vor(g.t).replace('vor ', '')} keine Meldung.</b> Rechner aus, Internet weg oder cadence geschlossen?</div>` : ''}
    ${z == 'fehler' ? `<div class=fehlerbox><b>✗ ${esc(g.fertig || 'Fehler')}</b><pre>${esc((g.log || []).join('\n'))}</pre></div>` : ''}
    ${z == 'fertig' ? `<div class=ok><b>✓ Fertig.</b> ${esc(g.fertig || '')}</div>` : ''}
  </div>
  <div class=karte><div class=schritte>${(g.schritte || []).map(s => `<div class="schr ${s.z} ${z == 'fehler' ? 'stop' : ''}">
      <span class=p>${s.z == 'f' ? '✓' : ''}</span>${s.z == 'l' ? `<b>${esc(s.n)}</b>` : esc(s.n)}</div>`).join('')}</div>
    ${z != 'fehler' ? `<details><summary>Letzte Protokollzeilen</summary><pre>${esc((g.log || []).join('\n'))}</pre></details>` : ''}
  </div>`;
}
function hilfe() {
  const h = document.getElementById('hilfe');
  if (!KANAL) {
    h.innerHTML = `<b>Kanal fehlt.</b> Öffne die Seite mit dem Link aus der Push-Nachricht oder trag den Kanal ein:
      <div style="display:flex;gap:8px;margin-top:10px"><input id=k placeholder="cadence-…"><button id=kok>Öffnen</button></div>`;
    document.getElementById('kok').onclick = () => { location.hash = document.getElementById('k').value.trim(); location.reload(); };
    return false;
  }
  mitteilungen();
  return true;
}
// Web-Push: Abo beim Pi anmelden (über den ntfy-Kanal KANAL-abo, der Pi liest mit)
const STANDALONE = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
const KANN_PUSH = 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
function b64bytes(s) { s = s.replace(/-/g, '+').replace(/_/g, '/'); const r = atob(s + '='.repeat((4 - s.length % 4) % 4));
  return Uint8Array.from(r, c => c.charCodeAt(0)); }
async function anmelden(abo) {
  await fetch(SERVER, {method: 'POST', body: JSON.stringify({topic: KANAL + '-abo',
    message: JSON.stringify({abo: abo.toJSON(), name: /iPhone|iPad/.test(navigator.userAgent) ? 'iPhone' : 'Browser'})})});
  try { localStorage.setItem('abo_gemeldet', Date.now()); } catch (e) {}
}
async function mitteilungen() {
  const h = document.getElementById('hilfe');
  if (!KANN_PUSH || !STANDALONE) {     // Anleitung steht oben (nicht doppelt) - hier nur der Weg zurück zu ihr
    h.innerHTML = `<b>Mitteilungen</b> gibt es in der App vom Home-Bildschirm.
      <div style="margin-top:10px"><button class=zweit id=anlzeig>So geht's</button></div>`;
    document.getElementById('anlzeig').onclick = () => { speicher('anleitung_weg', ''); try { localStorage.removeItem('anleitung_weg'); } catch (e) {} anleitung(); scrollTo(0, 0); };
    return;
  }
  const reg = await navigator.serviceWorker.register('sw.js');
  let abo = await reg.pushManager.getSubscription();
  if (abo && Notification.permission == 'granted') {
    h.innerHTML = `<b>✓ Mitteilungen sind an.</b> Bei Start, 25/50/75 %, Fertig und Fehlern kommt eine Mitteilung von
      „cadence live“ – ein Tipp öffnet diese App. Die ntfy-App brauchst du nicht mehr.`;
    let alt = 0; try { alt = +localStorage.getItem('abo_gemeldet') || 0; } catch (e) {}
    if (Date.now() - alt > 86400000) anmelden(abo).catch(() => {});   // einmal am Tag auffrischen (Pi-Neuinstallation)
    return;
  }
  h.innerHTML = `<b>Mitteilungen:</b> Einmal erlauben, dann meldet sich cadence live selbst bei Start, 25/50/75 %, Fertig und Fehlern.
    <div style="margin-top:10px"><button id=pushan>Mitteilungen erlauben</button></div>`;
  document.getElementById('pushan').onclick = async () => {
    if (await Notification.requestPermission() != 'granted') {
      h.innerHTML = '<b>Mitteilungen sind aus.</b> Einschalten: iPhone-Einstellungen → Mitteilungen → cadence live.'; return; }
    try {
      abo = await reg.pushManager.subscribe({userVisibleOnly: true, applicationServerKey: b64bytes(VAPID)});
      await anmelden(abo);
      mitteilungen();
    } catch (e) { h.innerHTML = `<b>Hat nicht geklappt:</b> ${esc(e.message || e)}`; }
  };
}
// Erst alles der letzten 12 h holen, dann live (SSE). iOS (Home-Bildschirm) hält SSE oft nicht offen -> zusätzlich
// alle 20 s abfragen; „live“ = SSE offen oder letzte Abfrage vor < 60 s geklappt
let SSE_AN = false, ABFRAGE_OK = 0, SEIT = '12h';
async function abfragen() {
  try {
    const r = await fetch(`${SERVER}${encodeURIComponent(KANAL)}-stand/json?poll=1&since=${SEIT}`, {cache: 'no-store'});
    if (!r.ok) throw new Error(r.status);
    for (const z of (await r.text()).split('\n')) {
      if (!z.trim()) continue;
      try { const m = JSON.parse(z); if (m.event == 'message') { aufnehmen(m.message); SEIT = m.id; } } catch (e) {}
    }
    ABFRAGE_OK = Date.now();
  } catch (e) {}
  zeichnen(); verbunden();
}
function verbunden() {
  const an = SSE_AN || Date.now() - ABFRAGE_OK < 60000, v = document.getElementById('verb');
  v.classList.toggle('an', an); v.lastElementChild.textContent = an ? 'live' : 'getrennt';
}
let QUELLE = null;
function live() {
  if (QUELLE) QUELLE.close();
  QUELLE = new EventSource(`${SERVER}${encodeURIComponent(KANAL)}-stand/sse?since=${SEIT}`);
  QUELLE.onopen = () => { SSE_AN = true; verbunden(); };
  QUELLE.onerror = () => { SSE_AN = false; verbunden(); };
  QUELLE.onmessage = e => { try { const m = JSON.parse(e.data);
    if (m.event == 'message') { aufnehmen(m.message); SEIT = m.id; zeichnen(); } } catch (x) {} };
}
async function laden() {
  await abfragen();
  live();
  setInterval(abfragen, 20000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) { abfragen(); live(); } });
}
// Beim ersten Öffnen im Browser: Anleitung „als App auf den Home-Bildschirm“ (Nutzer 09.10.2026)
function anleitung() {
  const el = document.getElementById('anleitung');
  if (STANDALONE || speicher('anleitung_weg')) { el.innerHTML = ''; return; }
  const ios = /iPhone|iPad|iPod/.test(navigator.userAgent);
  const teilen = '<svg class=teilsym viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12M7 8l5-5 5 5"/><path d="M5 12v8h14v-8"/></svg>';
  el.innerHTML = `<div class=karte><b>cadence live als App</b>
    <div class=hinweis style="margin-top:4px">So hast du sie mit Logo auf dem Home-Bildschirm und bekommst Mitteilungen:</div>
    ${ios ? `<ol><li>Diese Seite in <b>Safari</b> öffnen.</li>
      <li>Unten auf <b>Teilen</b> ${teilen} tippen.</li>
      <li><b>„Zum Home-Bildschirm“</b> wählen (evtl. etwas nach unten wischen) → <b>Hinzufügen</b>.</li>
      <li>Die App <b>cadence live</b> auf dem Home-Bildschirm öffnen und unten <b>„Mitteilungen erlauben“</b> tippen.</li></ol>`
          : `<ol><li>Oben rechts auf <b>⋮</b> tippen.</li>
      <li><b>„App installieren“</b> bzw. <b>„Zum Startbildschirm hinzufügen“</b> wählen.</li>
      <li>Die App <b>cadence live</b> öffnen und unten <b>„Mitteilungen erlauben“</b> tippen.</li></ol>`}
    <button class=zweit id=anlweg>Verstanden</button></div>`;
  document.getElementById('anlweg').onclick = () => { speicher('anleitung_weg', '1'); anleitung(); };
}
anleitung();
if (hilfe()) laden();
setInterval(() => { if (Object.keys(GERAETE).length) zeichnen(); }, 15000);   // „vor x min“, kein Lebenszeichen
</script>
</body>
</html>
